services:
  db:
    image: postgres:15
    container_name: sgt_dia_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: sped_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sped_db -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend-app  
      dockerfile: Dockerfile
    container_name: sgt_dia_backend
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/sped_db
      - NODE_ENV=development
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:-sgt-dia/alteracoes}
    ports:
      - "3000:3000"
    volumes:
      - ./backend-app:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: sgt_dia_frontend
    command: sh -c "npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-app:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules: