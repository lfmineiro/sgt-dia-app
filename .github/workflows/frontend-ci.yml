name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend-app/package-lock.json'

      - name: Instalar Dependências
        run: |
          cd frontend-app
          npm ci

      - name: Check de Tipagem (TypeScript)
        run: |
          cd frontend-app
          npx tsc --noEmit

      - name: Lint e Complexidade Ciclomática
        run: |
          cd frontend-app
          npm run lint

      - name: Cobertura de Testes
        run: |
          cd frontend-app
          npm run test:coverage

      - name: Upload Relatório de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-app/coverage/
          if-no-files-found: ignore

      - name: Testar Build de Produção (Vite)
        run: |
          cd frontend-app
          npm run build

      - name: Verificar Tamanho do Bundle
        run: |
          cd frontend-app
          BUNDLE_SIZE=$(find dist/assets -name "*.js" -type f -exec cat {} \; | wc -c)
          MAX_BUNDLE_SIZE=1310720
          echo "Bundle JS total: ${BUNDLE_SIZE} bytes (limite: ${MAX_BUNDLE_SIZE})"
          if [ "$BUNDLE_SIZE" -gt "$MAX_BUNDLE_SIZE" ]; then
            echo "❌ Bundle JS excede 1.25MB (atual: ${BUNDLE_SIZE} bytes)"
            exit 1
          fi
          echo "✅ Bundle dentro do limite"