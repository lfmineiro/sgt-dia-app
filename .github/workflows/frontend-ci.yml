name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend-app/package-lock.json'

      - name: Instalar Dependências
        run: |
          cd frontend-app
          npm ci

      - name: Audit de Dependências
        run: |
          cd frontend-app
          npm audit --audit-level=high

      - name: Linter (ESLint)
        run: |
          cd frontend-app
          npm run lint

      - name: Check de Tipagem (TypeScript)
        run: |
          cd frontend-app
          npx tsc --noEmit

      - name: Testar Build de Produção (Vite)
        run: |
          cd frontend-app
          npm run build